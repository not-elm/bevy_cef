[package]
name = "bevy_cef_render_process"
description = "render process for bevy_cef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cef = { workspace = true }
# Workspace declares `bevy_cef_core` with default-features = false, so this
# binary depends on no Bevy crate: no bevy_remote, no renderer, no bevy_winit.
bevy_cef_core = { workspace = true }
cef-dll-sys = { workspace = true }

# Applies only when this package is the build root, i.e. `cargo install
# bevy_cef_render_process` from crates.io. Inside the workspace Cargo uses the
# root manifest's copy and warns that this one is ignored; keep the two identical.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = "z"

[lints]
workspace = true

